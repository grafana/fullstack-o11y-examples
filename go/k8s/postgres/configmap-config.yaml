apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: bookstore
data:
  postgresql.conf: |
    # Grafana Database Observability — PostgreSQL server settings (Kubernetes variant).
    # Applied via an `include` appended to $PGDATA/postgresql.conf on first init
    # (see 00-dbo11y-include.sh); values here override the defaults above the include.
    # Unlike docker-compose, logs go to stderr (pod stdout) for loki.source.kubernetes,
    # so logging_collector is left off.
    
    # ── Query statistics (DB o11y query_samples / explain_plans) ─────────────────
    shared_preload_libraries = 'pg_stat_statements'
    compute_query_id = on
    pg_stat_statements.track = all
    track_activity_query_size = 4096
    
    # ── Verbose, structured logging (to stderr) for the DB o11y "logs" collector ─
    log_error_verbosity = verbose
    log_line_prefix = '%m:%r:%u@%d:[%p]:%l:%e:%s:%v:%x:%c:%q%a:'
    log_min_duration_statement = '1s'
    log_lock_waits = on
    log_temp_files = 0
    log_autovacuum_min_duration = '1s'
