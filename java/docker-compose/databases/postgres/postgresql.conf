# Grafana Database Observability — PostgreSQL server settings.
# Applied via an `include` appended to $PGDATA/postgresql.conf on first init
# (see dbo11y-include.sh); values here override the defaults above the include.

# ── Query statistics (DB o11y query_samples / explain_plans) ─────────────────
shared_preload_libraries = 'pg_stat_statements'
compute_query_id = on
pg_stat_statements.track = all
track_activity_query_size = 4096

# ── Verbose, structured logging for the DB o11y "logs" collector ─────────────
# logging_collector writes to <PGDATA>/log; Alloy tails the file (loki.source.file).
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql.log'
log_rotation_age = 0
log_rotation_size = 0
log_error_verbosity = verbose
log_line_prefix = '%m:%r:%u@%d:[%p]:%l:%e:%s:%v:%x:%c:%q%a:'
log_min_duration_statement = '1s'
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = '1s'
