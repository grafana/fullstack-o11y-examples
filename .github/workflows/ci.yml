name: CI

# Build/compile every language example so dependency bumps (incl. Renovate
# automerge PRs) prove each example still builds. Required status checks are
# also recommended to protect manual merges.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR runs, but never cancel a push build on main (keep the
# post-merge signal on every main commit).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: go build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go/docker-compose/services
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go/docker-compose/services/go.mod
          cache-dependency-path: go/docker-compose/services/go.sum
      - run: go build ./...
      - run: go vet ./...

  python:
    name: python build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [products, shipping, checkout]
    defaults:
      run:
        working-directory: python/docker-compose/services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          # Include the shared base file so the cache key changes when it does.
          cache-dependency-path: |
            python/docker-compose/services/${{ matrix.service }}/requirements.txt
            python/docker-compose/services/common/base-requirements.txt
      - run: pip install -r requirements.txt
      - name: Byte-compile sources
        run: python -m compileall -q . ../common

  java:
    name: java build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [products, shipping, checkout]
    defaults:
      run:
        working-directory: java/docker-compose/services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -ntp -DskipTests package

  ruby:
    name: ruby build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ruby/docker-compose/services
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.4.10"
          working-directory: ruby/docker-compose/services
          bundler-cache: true
      - name: Syntax-check sources
        run: |
          set -euo pipefail
          count=$(git ls-files '*.rb' | wc -l)
          [ "$count" -gt 0 ] || { echo "No .rb files matched — refusing to pass"; exit 1; }
          git ls-files -z '*.rb' | xargs -0 -n1 ruby -c

  nodejs:
    name: nodejs build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            dir: nodejs/docker-compose/frontend
            build: true
          - name: services
            dir: nodejs/docker-compose/services
            build: false
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      # No lockfiles are committed, so use `npm install` (not `npm ci`).
      - run: npm install
      - name: Build
        if: matrix.build
        run: npm run build
      - name: Syntax-check sources
        if: ${{ !matrix.build }}
        run: |
          set -euo pipefail
          count=$(git ls-files '*.js' | wc -l)
          [ "$count" -gt 0 ] || { echo "No .js files matched — refusing to pass"; exit 1; }
          git ls-files -z '*.js' | xargs -0 -n1 node --check

  docker:
    name: docker build (${{ matrix.lang }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [go, python, java, ruby, nodejs]
    defaults:
      run:
        working-directory: ${{ matrix.lang }}/docker-compose
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # Builds every service image via each stack's compose file (correct
      # per-service build contexts). Gates docker base-image bumps: a broken
      # base image fails the image build even when the native build passes.
      # Frontend build args default via `${VAR:-...}`, so no secrets needed.
      - run: docker compose build
