server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Proxy API calls to the backend services (single-origin avoids CORS and lets
  # Faro's trace context propagate to the backends).
  location /api/products  { proxy_pass http://products:8001; }
  location /api/checkout  { proxy_pass http://checkout:8002; }
  location /api/orders    { proxy_pass http://checkout:8002; }
  location /api/shipping  { proxy_pass http://shipping:8003; }
  location /api/shipments { proxy_pass http://shipping:8003; }

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
