# Backend services. Images must be built from ../docker-compose/services and
# pushed to a registry your cluster can pull (see k8s/README.md). envFrom pulls
# both the shared config and DB secret; unused keys per service are harmless.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: products
  namespace: bookstore
spec:
  replicas: 1
  selector: { matchLabels: { app: products } }
  template:
    metadata:
      labels: { app: products }
    spec:
      containers:
        - name: products
          image: bookstore-go/products:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8001 }]
          env:
            - { name: SERVICE_PORT, value: "8001" }
            - name: ASSERTS_ENV
              valueFrom: { configMapKeyRef: { name: bookstore-config, key: ASSERTS_ENV } }
            - name: ASSERTS_SITE
              valueFrom: { configMapKeyRef: { name: bookstore-config, key: ASSERTS_SITE } }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=bookstore,deployment.environment=$(ASSERTS_ENV),asserts_site=$(ASSERTS_SITE),service.instance.id=$(POD_NAME)"
          envFrom:
            - configMapRef: { name: bookstore-config }
            - secretRef: { name: bookstore-db }
          readinessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: products
  namespace: bookstore
spec:
  selector: { app: products }
  ports: [{ port: 8001, targetPort: 8001 }]
---
