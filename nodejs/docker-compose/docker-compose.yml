name: bookstore-o11y-nodejs

# Continuous profiling, shared by all three Node.js services. Setting
# PYROSCOPE_SERVER_ADDRESS makes services/common/profiling.js start the
# @pyroscope/nodejs SDK, which pushes wall/CPU + heap profiles to
# Alloy → Grafana Cloud. Enabled here rather than baked into the images so
# other consumers of the same Dockerfiles (nodejs/k8s) opt in explicitly.
x-pyroscope-env: &pyroscope_env
  PYROSCOPE_SERVER_ADDRESS: http://alloy:9999
  PYROSCOPE_LABELS: namespace=bookstore

services:
  mysql:
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    container_name: bookstore-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      # Seed schema/data, then create the DB o11y collector user (ordered 01-, 02-).
      - ./databases/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./databases/mysql/dbo11y-user.sql:/docker-entrypoint-initdb.d/02-dbo11y-user.sql:ro
      # DB o11y server config (performance_schema + full digests/SQL text).
      - ./databases/mysql/dbo11y.cnf:/etc/mysql/conf.d/dbo11y.cnf:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 30s
    networks: [bookstore]

  postgres:
    image: postgres:latest@sha256:7157393f508fd8eb46119937fab39813783fe3e7d4c6316c45c12ce2ea25e61d
    container_name: bookstore-postgres
    ports:
      - "5432:5432"
    # DB o11y server settings (pg_stat_statements + verbose logging) live in
    # databases/postgres/postgresql.conf, included into $PGDATA/postgresql.conf by
    # the init script below. logging_collector writes to <PGDATA>/log, which Alloy
    # tails read-only via loki.source.file (log_line_prefix %e = SQLSTATE).
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Seed schema/data, then create the DB o11y collector role (ordered 01-, 02-).
      - ./databases/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./databases/postgres/dbo11y-user.sql:/docker-entrypoint-initdb.d/02-dbo11y-user.sql:ro
      # Append `include '/etc/postgresql/postgresql.conf'` to $PGDATA/postgresql.conf.
      - ./databases/postgres/dbo11y-include.sh:/docker-entrypoint-initdb.d/00-dbo11y-include.sh:ro
      - ./databases/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 20s
    networks: [bookstore]

  alloy:
    image: grafana/alloy:v1.17.1@sha256:4f6ddc56ffdcf8a6316748fc5162972e20cb301523cac1bb4a31957df733ae9b
    container_name: bookstore-alloy
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "12345:12345" # Alloy UI
      - "12347:12347" # Faro receiver
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Read PostgreSQL server logs (postgres_data volume) for the DB o11y "logs"
      # collector — no container-runtime socket needed.
      - postgres_data:/var/lib/postgresql:ro
    environment:
      GCLOUD_PROMETHEUS_URL: ${GCLOUD_PROMETHEUS_URL}
      GCLOUD_PROMETHEUS_USERNAME: ${GCLOUD_PROMETHEUS_USERNAME}
      GCLOUD_PROMETHEUS_PASSWORD: ${GCLOUD_PROMETHEUS_PASSWORD}
      GCLOUD_LOKI_URL: ${GCLOUD_LOKI_URL}
      GCLOUD_LOKI_USERNAME: ${GCLOUD_LOKI_USERNAME}
      GCLOUD_LOKI_PASSWORD: ${GCLOUD_LOKI_PASSWORD}
      GCLOUD_PYROSCOPE_URL: ${GCLOUD_PYROSCOPE_URL}
      GCLOUD_PYROSCOPE_USERNAME: ${GCLOUD_PYROSCOPE_USERNAME}
      GCLOUD_PYROSCOPE_PASSWORD: ${GCLOUD_PYROSCOPE_PASSWORD}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_USERNAME: ${OTEL_EXPORTER_OTLP_USERNAME}
      OTEL_EXPORTER_OTLP_PASSWORD: ${OTEL_EXPORTER_OTLP_PASSWORD}
      # KG env/site scope — single source for the external_labels in
      # alloy/config.alloy and the services' OTEL_RESOURCE_ATTRIBUTES
      # (default dev; override once in .env).
      ASSERTS_ENV: ${ASSERTS_ENV:-dev}
      ASSERTS_SITE: ${ASSERTS_SITE:-dev}
      # Database Observability DSNs (Alloy reaches the DBs on the bookstore network).
      # The component uses the go-sql-driver "@tcp(...)" form; mysqld_exporter uses "@(...)".
      MYSQL_DSN: "root:${MYSQL_ROOT_PASSWORD}@tcp(mysql:3306)/"
      MYSQL_EXPORTER_DSN: "root:${MYSQL_ROOT_PASSWORD}@(mysql:3306)/"
      POSTGRES_DSN: "postgres://db-o11y:db-o11y-pass@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      # database_observability.* components are experimental — allow them to load.
      - --stability.level=experimental
      - /etc/alloy/config.alloy
    networks: [bookstore]

  products:
    build:
      context: ./services
      dockerfile: products/Dockerfile
    container_name: bookstore-products
    ports:
      - "8001:8001"
    environment: &mysql_svc_env
      <<: *pyroscope_env
      SERVICE_PORT: 8001
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=bookstore,deployment.environment=${ASSERTS_ENV:-dev},asserts_site=${ASSERTS_SITE:-dev},service.instance.id=bookstore-products,grafana.host.id=${HOSTNAME:-bookstore-docker}
      # Profile streams are keyed by this name (must match OTEL_SERVICE_NAME,
      # set in the Dockerfile, so profiles correlate with traces); the server
      # address comes from x-pyroscope-env.
      PYROSCOPE_APPLICATION_NAME: products-service
    depends_on:
      mysql: {condition: service_healthy}
      alloy: {condition: service_started}
    networks: [bookstore]

  checkout:
    build:
      context: ./services
      dockerfile: checkout/Dockerfile
    container_name: bookstore-checkout
    ports:
      - "8002:8002"
    environment:
      <<: *mysql_svc_env
      SERVICE_PORT: 8002
      SHIPPING_URL: http://shipping:8003
      # PYROSCOPE_SERVER_ADDRESS is inherited via the anchors above; only the
      # per-service app name needs overriding.
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=bookstore,deployment.environment=${ASSERTS_ENV:-dev},asserts_site=${ASSERTS_SITE:-dev},service.instance.id=bookstore-checkout,grafana.host.id=${HOSTNAME:-bookstore-docker}
      PYROSCOPE_APPLICATION_NAME: checkout-service
    depends_on:
      mysql: {condition: service_healthy}
      alloy: {condition: service_started}
    networks: [bookstore]

  shipping:
    build:
      context: ./services
      dockerfile: shipping/Dockerfile
    container_name: bookstore-shipping
    ports:
      - "8003:8003"
    environment:
      <<: *pyroscope_env
      SERVICE_PORT: 8003
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=bookstore,deployment.environment=${ASSERTS_ENV:-dev},asserts_site=${ASSERTS_SITE:-dev},service.instance.id=bookstore-shipping,grafana.host.id=${HOSTNAME:-bookstore-docker}
      PYROSCOPE_APPLICATION_NAME: shipping-service
    depends_on:
      postgres: {condition: service_healthy}
      alloy: {condition: service_started}
    networks: [bookstore]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_FARO_ENDPOINT: ${VITE_FARO_ENDPOINT:-}
        VITE_ASSERTS_ENV: ${ASSERTS_ENV:-dev}
    container_name: bookstore-frontend
    ports:
      - "8080:80"
    depends_on:
      - products
      - checkout
      - shipping
    networks: [bookstore]

volumes:
  mysql_data:
  postgres_data:

networks:
  bookstore:
    driver: bridge
