apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: bookstore
---
# Alloy needs to read pod logs (pods/log) for the DB o11y "logs" collector
# (loki.source.kubernetes). Cluster-scoped names are prefixed to avoid collisions.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bookstore-alloy
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bookstore-alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bookstore-alloy
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: bookstore
